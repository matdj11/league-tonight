<!DOCTYPE html>
<html>
<head>
    <title>Team Briefing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0B0F17; color: #F5F3EE; padding: 40px 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        .header .eyebrow { color: #5EEAD4; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; }
        .header h1 { font-size: 24px; font-weight: 800; margin-bottom: 30px; }
        .insight { padding: 12px 0; border-bottom: 1px solid #2A3245; font-size: 13px; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="eyebrow">Your Briefing</div>
            <h1>Team Briefing</h1>
        </div>
        <div class="insight">Briefing content coming soon.</div>
    </div>
</body>
</html>

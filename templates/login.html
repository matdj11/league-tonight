<!DOCTYPE html>
<html>
<head>
    <title>Log In</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0B0F17; color: #F5F3EE; padding: 60px 20px; }
        .container { max-width: 420px; margin: 0 auto; }
        .eyebrow { color: #5EEAD4; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px; text-align: center; }
        h1 { font-size: 28px; font-weight: 800; margin-bottom: 30px; text-align: center; }
        .card { background: #151B29; border: 1px solid #2A3245; border-radius: 12px; padding: 24px; }
        label { display: block; font-size: 12px; color: #8B93A7; margin-bottom: 8px; margin-top: 14px; }
        label:first-child { margin-top: 0; }
        input { width: 100%; padding: 12px 14px; background: #0B0F17; border: 1px solid #2A3245; border-radius: 8px; color: #F5F3EE; font-size: 16px; letter-spacing: 0.1em; text-align: center; }
        input:focus { outline: none; border-color: #5EEAD4; }
        .btn { width: 100%; background: #FFB020; color: #3A2600; padding: 14px; border-radius: 8px; font-weight: 700; font-size: 14px; border: none; cursor: pointer; margin-top: 20px; }
        .btn:hover { background: #E6A018; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { margin-top: 14px; font-size: 13px; min-height: 18px; text-align: center; }
        .status.error { color: #FF6B5E; }
        .status.success { color: #5EEAD4; }
        .join-link { text-align: center; margin-top: 20px; font-size: 13px; color: #8B93A7; }
        .join-link a { color: #5EEAD4; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="eyebrow">Welcome back</div>
        <h1>Log In to Your Team</h1>

        <div class="card">
            <label>League PIN</label>
            <input type="text" id="league_pin" placeholder="6-digit PIN" maxlength="6" />
            <label>Your Team PIN</label>
            <input type="text" id="team_pin" placeholder="4-digit PIN" maxlength="4" />
            <button class="btn" id="login_btn" onclick="loginTeam()">Log In</button>
            <div class="status" id="status"></div>
        </div>

        <div class="join-link">
            Haven't claimed your team yet? <a href="/join">Join here</a>
        </div>
    </div>

    <script>
        async function loginTeam() {
            const leaguePin = document.getElementById('league_pin').value.trim();
            const teamPin = document.getElementById('team_pin').value.trim();
            const statusEl = document.getElementById('status');
            const btn = document.getElementById('login_btn');

            if (!leaguePin || !teamPin) {
                statusEl.textContent = 'Please enter both PINs.';
                statusEl.className = 'status error';
                return;
            }

            btn.disabled = true;
            statusEl.textContent = 'Logging in...';
            statusEl.className = 'status';

            try {
                const res = await fetch('/api/team/login-with-pin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ league_pin: leaguePin, team_pin: teamPin })
                });
                const data = await res.json();

                if (data.status !== 'logged in') {
                    throw new Error(data.error || 'Login failed.');
                }

                statusEl.textContent = `Welcome back, ${data.team_name}!`;
                statusEl.className = 'status success';

                setTimeout(() => {
                    window.location.href = `/team-home?league_id=${encodeURIComponent(data.league_id)}&team_id=${encodeURIComponent(data.team_id)}`;
                }, 800);

            } catch (err) {
                statusEl.textContent = err.message;
                statusEl.className = 'status error';
                btn.disabled = false;
            }
        }

        document.getElementById('team_pin').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') loginTeam();
        });
    </script>
</body>
</html>

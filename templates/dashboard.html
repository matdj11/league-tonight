<!DOCTYPE html>
<html>
<head>
    <title>League Tonight - Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0B0F17; color: #F5F3EE; padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { font-size: 28px; margin-bottom: 10px; }
        .subtitle { color: #8B93A7; margin-bottom: 40px; }
        .card { background: #151B29; border: 1px solid #2A3245; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
        .card h2 { font-size: 18px; margin-bottom: 12px; }
        .card p { color: #8B93A7; line-height: 1.6; margin-bottom: 12px; }
        .btn { display: inline-block; background: #FFB020; color: #3A2600; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 600; border: none; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #E6A018; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { display: inline-block; padding: 4px 12px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .status.draft { background: #8A6318; color: #FFB020; }
        .status.published { background: #1F5A50; color: #5EEAD4; }
        .link { color: #5EEAD4; text-decoration: none; word-break: break-all; }
        .msg { margin-top: 12px; font-size: 13px; color: #8B93A7; min-height: 18px; }
        .msg.success { color: #5EEAD4; }
        .msg.error { color: #FF6B5E; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ league.name }}</h1>
        <p class="subtitle">Commissioner Dashboard</p>

        <div class="card">
            <h2>League Information</h2>
            <p><strong>League ID:</strong> {{ league.league_id }}</p>
